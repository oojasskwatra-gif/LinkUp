<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .profile-container {
      background: #fff;
      width: 400px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 30px;
      margin-top: 40px;
    }

    h1 {
      text-align: center;
      font-size: 1.8em;
      color: #333;
    }

    .profile-pic {
      display: block;
      margin: 20px auto;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      color: white;
      font-size: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .name {
      text-align: center;
      font-size: 1.3em;
      font-weight: 600;
      color: #111;
    }

    .btn {
      display: inline-block;
      padding: 6px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9em;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1e40af;
    }

    .section {
      margin-top: 20px;
      padding: 10px 0;
      border-top: 1px solid #e5e7eb;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      color: #374151;
    }

    .info-text {
      margin-top: 6px;
      font-size: 0.95em;
      color: #444;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .back-btn:hover {
      background: #1e40af;
    }

  </style>
</head>
<body>
  <a href="try.html" class="back-btn">← Back</a>

  <div class="profile-container">
    <h1>My Profile</h1>

    <div class="profile-pic">O</div>

    <div class="name">Oojass Kwatra</div>

    <div style="text-align:center; margin-top:10px;">
      <button class="btn">Set Status</button>
    </div>

    <div class="section">
      <div class="section-header">
        <span>Contact Information</span>
      </div>
      <div class="info-text">Email: abc@gmail.com</div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>About Me</span>
      </div>
      <div class="info-text">Write something about yourself...</div>
    </div>
  </div>

</body>
</html>
